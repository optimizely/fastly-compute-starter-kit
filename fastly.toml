# This file describes a Fastly Compute@Edge package. To learn more visit:
# https://developer.fastly.com/reference/fastly-toml/

authors = ["zeeshan.ashraf@optimizely.com"]
description = "A basic starter kit for Fastly's Compute@Edge with Optimizely built in."
language = "javascript"
manifest_version = 2
name = "Optimizely Feature Experimentation, Optimizely Full Stack (legacy), and Optimizely Rollouts"

[scripts]
  build = "npm run build"

[setup.backends]

  [setup.backends.optlycdn]
    address = "cdn.optimizely.com"
    port = 443

  [setup.backends.optlylogx]
    address = "logx.optimizely.com"
    port = 443

[setup.config_stores]

  [setup.config_stores.optimizely]
    description = "Optimizely configuration (SDK key and optional datafile cache TTL)"

    [setup.config_stores.optimizely.items]

      [setup.config_stores.optimizely.items.sdk_key]
        value = "YOUR_SDK_KEY_HERE"
        input_type = "string"

      [setup.config_stores.optimizely.items.datafile_ttl_seconds]
        value = "300"
        input_type = "number"

[local_server.backends]

    [local_server.backends.optlycdn]
      url = "https://cdn.optimizely.com"

    [local_server.backends.optlylogx]
      url = "https://logx.optimizely.com"

[local_server.config_stores]

    [local_server.config_stores.optimizely]
      format = "inline-toml"

      [local_server.config_stores.optimizely.contents]
        sdk_key = "YOUR_SDK_KEY_HERE"
        datafile_ttl_seconds = "300"
